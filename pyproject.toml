[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qgis_mcp_workflows"]

[project]
name = "qgis-mcp-workflows"
version = "1.6.0"
description = "Focused QGIS MCP server with workflow tools for transportation research figure pipelines (PFLOW, GUFM). Forked from nkarasiak/qgis-mcp."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.20.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23"]
pptx = ["python-pptx>=1.0"]
trajectory = ["movingpandas>=0.20"]
bench = ["pytest-benchmark>=4.0"]
drm = ["pyogrio>=0.7", "geopandas>=0.14"]
duckdb = ["duckdb>=1.0"]

[project.scripts]
qgis-mcp-workflows-server = "qgis_mcp_workflows.server:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # line too long — handled by formatter
]

# The plugin package runs under QGIS's bundled interpreter — Python 3.9 on
# QGIS-LTR for macOS — not the server's 3.12. Without this, ruff's UP rules
# offer a one-keystroke auto-fix rewriting `timezone.utc` to `datetime.UTC`,
# which is 3.11+ and raises ImportError at plugin load. That exact rewrite is
# the bug fixed in v1.4.1; this stops it being suggested again.
[tool.ruff.per-file-target-version]
"qgis_mcp_workflows_plugin/**" = "py39"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"_archive/*" = ["ALL"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "bench: long-running benchmarks (skipped by default; run with `pytest -m bench`)",
    "slow: integration tests that take >10s",
    "network: hits live tile servers; deselected by default so CI/offline runs stay green",
]
addopts = "-m 'not bench and not network'"
